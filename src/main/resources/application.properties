spring.application.name=hostelconnect

# MySQL Configuration (set via environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cdac_hostel_connect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# JWT secret - MUST be set as an environment variable, no default in production
jwt.secret=${JWT_SECRET}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Local image storage
app.upload.dir=${UPLOAD_DIR:uploads/hostels}

admin.registration.code=${ADMIN_REG_CODE}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
registration.fee=500
